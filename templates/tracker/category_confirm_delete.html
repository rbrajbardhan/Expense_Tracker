{% extends 'base.html' %}
{% block title %}Delete Category | FinAI Tracker{% endblock %}

{% block content %}
<div class="container-fluid py-4" style="max-width: 600px; margin: 0 auto;">
    <div class="glass-card p-5 text-center text-white">
        <i class="bi bi-exclamation-triangle text-danger display-1 mb-4"></i>
        <h2 class="fw-bold mb-3">Delete Category?</h2>
        <p class="text-secondary mb-4">Are you sure you want to delete the category "<strong>{{ object.name }}</strong>"? This action cannot be undone.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'category_list' %}" class="btn btn-outline-light px-4">Cancel</a>
                <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
