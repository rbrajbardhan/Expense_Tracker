{% load static %}
<div class="sidebar" id="sidebar">
    <div class="brand">
        <i class="bi bi-cpu text-primary"></i>
        <span>FinAI Tracker</span>
    </div>
    
    <div class="flex-grow-1">
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <i class="bi bi-grid"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'income_list' %}" class="nav-link {% if 'income' in request.path %}active{% endif %}">
            <i class="bi bi-wallet2 text-success"></i>
            <span>Income</span>
        </a>
        <a href="{% url 'expense_list' %}" class="nav-link {% if 'expense' in request.path %}active{% endif %}">
            <i class="bi bi-cart text-danger"></i>
            <span>Expenses</span>
        </a>
        <a href="{% url 'category_list' %}" class="nav-link {% if 'category' in request.path %}active{% endif %}">
            <i class="bi bi-tags text-warning"></i>
            <span>Categories</span>
        </a>
        <a href="{% url 'budget_list' %}" class="nav-link {% if 'budget' in request.path %}active{% endif %}">
            <i class="bi bi-pie-chart text-info"></i>
            <span>Budgets</span>
        </a>
        <a href="{% url 'savings_list' %}" class="nav-link {% if 'savings' in request.path %}active{% endif %}">
            <i class="bi bi-piggy-bank text-primary"></i>
            <span>Savings Goals</span>
        </a>
        
        <hr class="text-secondary my-3 opacity-25">
        
        <a href="{% url 'analytics_dashboard' %}" class="nav-link {% if 'analytics/dashboard' in request.path %}active{% endif %}">
            <i class="bi bi-bar-chart"></i>
            <span>Analytics</span>
        </a>
        <a href="{% url 'ai_insights' %}" class="nav-link {% if 'ai-insights' in request.path %}active{% endif %}">
            <i class="bi bi-stars text-info"></i>
            <span>AI Insights</span>
        </a>
        <a href="{% url 'report_page' %}" class="nav-link {% if 'reports' in request.path %}active{% endif %}">
            <i class="bi bi-file-earmark-text"></i>
            <span>Reports</span>
        </a>
    </div>

    <div class="mt-auto">
        <a href="{% url 'profile' %}" class="nav-link {% if 'profile' in request.path %}active{% endif %}">
            <i class="bi bi-person-circle"></i>
            <span>{{ request.user.username|capfirst }}</span>
        </a>
        <form action="{% url 'logout' %}" method="post" class="d-inline w-100">
            {% csrf_token %}
            <button type="submit" class="nav-link bg-transparent border-0 text-start w-100 p-2 text-danger align-items-center d-flex gap-2">
                <i class="bi bi-box-arrow-left"></i>
                <span>Logout</span>
            </button>
        </form>
    </div>
</div>
